# Render Blueprint — Neon + MongoDB Atlas + Render + Vercel
# After sync: replace XXXX Render hostnames in any remaining service env UIs if needed.
# Ensure Neon DBs exist: campusworks_auth, campusworks_tasks, campusworks_bids, campusworks_profile

services:
  - type: web
    name: cw-eureka-server
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./campus-works-backend/eureka-server/Dockerfile
    dockerContext: ./campus-works-backend/eureka-server
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_OPTS
        value: "-Xms32m -Xmx180m"
      - key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_NON_SECURE_PORT_ENABLED
        value: "false"
      - key: EUREKA_SECURE_PORT_ENABLED
        value: "true"
      - key: EUREKA_INSTANCE_SECURE_PORT
        value: "443"

