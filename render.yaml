# Render Blueprint — Neon + MongoDB Atlas + Render + Vercel
# Dashboard: New → Blueprint → connect this repo → apply render.yaml
#
# Free tier: services sleep when idle (cold starts 1–2 min).
# After first deploy: set Eureka URL, Neon JDBC URLs, Atlas URI, and direct GATEWAY_* URIs.
# See DEPLOYMENT.md for the full checklist.

services:
  - type: web
    name: cw-eureka-server
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./campus-works-backend/eureka-server/Dockerfile
    dockerContext: ./campus-works-backend/eureka-server
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx200m"
      - key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_NON_SECURE_PORT_ENABLED
        value: "false"
      - key: EUREKA_SECURE_PORT_ENABLED
        value: "true"
      - key: EUREKA_INSTANCE_SECURE_PORT
        value: "443"

  - type: web
    name: cw-auth-service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./campus-works-backend/auth-service/Dockerfile
    dockerContext: ./campus-works-backend/auth-service
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx200m"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        sync: false
      - key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_NON_SECURE_PORT_ENABLED
        value: "false"
      - key: EUREKA_SECURE_PORT_ENABLED
