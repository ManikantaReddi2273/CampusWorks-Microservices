# ===================================
# PAYMENT SERVICE CONFIGURATION
# ===================================

# Application Configuration
spring.application.name=payment-service
server.port=8084

# ===================================
# DATABASE CONFIGURATION
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/campusworks_payment
spring.datasource.username=root
spring.datasource.password=reddi2273
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# EUREKA CLIENT CONFIGURATION
# ===================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===================================
# RAZORPAY CONFIGURATION
# ===================================
# 🔑 REPLACE THESE WITH YOUR ACTUAL RAZORPAY KEYS
payment.razorpay.key-id=rzp_test_YOUR_KEY_ID_HERE
payment.razorpay.key-secret=YOUR_SECRET_KEY_HERE
payment.razorpay.webhook-secret=YOUR_WEBHOOK_SECRET_HERE
payment.razorpay.mode=test

# Razorpay Settings
payment.razorpay.currency=INR
payment.razorpay.company-name=CampusWorks
payment.razorpay.timeout=300000

# ===================================
# PAYMENT SERVICE BUSINESS LOGIC
# ===================================
# Platform fee percentage (5% = 0.05)
payment.platform-fee-percentage=0.05

# Minimum and maximum transaction amounts (in INR)
payment.min-transaction-amount=10.00
payment.max-transaction-amount=100000.00

# Escrow settings
payment.escrow.auto-check-interval=3600000
payment.escrow.notification-enabled=true

# ===================================
# FEIGN CLIENT CONFIGURATION
# ===================================
# Timeout settings
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# Circuit breaker settings
resilience4j.circuitbreaker.instances.task-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.task-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.task-service.sliding-window-size=10

resilience4j.circuitbreaker.instances.profile-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.profile-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.profile-service.sliding-window-size=10

resilience4j.circuitbreaker.instances.bidding-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bidding-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.bidding-service.sliding-window-size=10

# ===================================
# LOGGING CONFIGURATION
# ===================================
logging.level.com.campusworks.payment=DEBUG
logging.level.com.razorpay=DEBUG
logging.level.feign=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================
# ACTUATOR ENDPOINTS
# ===================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
