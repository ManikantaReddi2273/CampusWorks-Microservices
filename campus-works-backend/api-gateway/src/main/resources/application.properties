# Server Configuration (Render sets PORT)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Spring Application
spring.application.name=api-gateway
spring.main.web-application-type=reactive

# Spring Cloud Gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Render free tier cold-starts often take 60–120s
spring.cloud.gateway.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:15000}
spring.cloud.gateway.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:120s}
spring.cloud.gateway.httpclient.pool.type=elastic

# Gateway Routes — use GATEWAY_*_URI env for direct HTTPS on Render free tier
spring.cloud.gateway.routes[0].id=auth-service-api
spring.cloud.gateway.routes[0].uri=${GATEWAY_AUTH_SERVICE_URI:lb://auth-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=task-service-api
spring.cloud.gateway.routes[1].uri=${GATEWAY_TASK_SERVICE_URI:lb://task-service}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tasks/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=bidding-service-api
spring.cloud.gateway.routes[2].uri=${GATEWAY_BIDDING_SERVICE_URI:lb://bidding-service}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bids/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=profile-service-api
spring.cloud.gateway.routes[3].uri=${GATEWAY_PROFILE_SERVICE_URI:lb://profile-service}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/profiles/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# CORS (also used by SecurityConfig)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${EUREKA_INSTANCE_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_INSTANCE_SECURE_PORT:443}
eureka.client.healthcheck.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.diskspace.enabled=false
management.health.eureka.enabled=false
management.endpoint.health.group.liveness.include=livenessState,ping
eureka.client.healthcheck.enabled=false

# JWT Security
security.jwt.secret=${JWT_SECRET:mysupersecuresecretkeythatismorethan32chars}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.campusworks.gateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
