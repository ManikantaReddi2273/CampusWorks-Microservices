# =========================
# Server Configuration
# =========================
server.port=9000

# =========================
# Spring Application
# =========================
spring.application.name=auth-service

# =========================
# Database Configuration
# =========================
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/campusworks_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:reddi2273}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA/Hibernate Configuration
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# =========================
# JWT Configuration
# =========================
security.jwt.secret=${JWT_SECRET:mysupersecuresecretkeythatismorethan32chars}
security.jwt.expiration=86400000

# =========================
# Eureka Client
# =========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.instance.hostname=${EUREKA_HOSTNAME:auth-service}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.healthcheck.enabled=true

# Lease + heartbeat tuning
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.initial-instance-info-replication-interval-seconds=30
eureka.client.registry-fetch-interval-seconds=15

# =========================
# Actuator Configuration
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# Email Configuration (SMTP)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:campusworks2273@gmail.com}
spring.mail.password=${MAIL_PASSWORD:nlbdkysxhffrjwnt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# =========================
# Application Configuration
# =========================
app.name=CampusWorks
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.verification.token.expiry=24

# =========================
# College Email Validation
# =========================
app.email.college.domain=rguktn.ac.in
app.email.college.pattern=^n\\d{6}@rguktn\\.ac\\.in$

# =========================
# Logging Configuration
# =========================
logging.level.com.campusworks=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.mail=INFO
