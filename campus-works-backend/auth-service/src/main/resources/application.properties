# Server Configuration (Render sets PORT)
server.port=${PORT:9000}
server.forward-headers-strategy=framework

# Spring Application
spring.application.name=auth-service

# Database Configuration (PostgreSQL / Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusworks_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:reddi2273}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari — Neon-safe (small pool, tolerate cold starts)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
security.jwt.secret=${JWT_SECRET:mysupersecuresecretkeythatismorethan32chars}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${EUREKA_INSTANCE_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_INSTANCE_SECURE_PORT:443}
eureka.client.healthcheck.enabled=true

# Actuator — Render health must stay 200 even if Eureka is empty on free tier
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.diskspace.enabled=false
management.health.eureka.enabled=false
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db
eureka.client.healthcheck.enabled=false
spring.cloud.service-registry.auto-registration.enabled=true

# Email Configuration (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:campusworks2273@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Application Configuration
app.name=CampusWorks
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.verification.token.expiry=24

# Email Validation (any standard email allowed)
app.email.pattern=^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$

# Logging
logging.level.com.campusworks=INFO
logging.level.org.springframework.security=INFO
