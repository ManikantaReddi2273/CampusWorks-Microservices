# =========================
# Server Configuration
# =========================
server.port=${SERVICE_PORT:9000}

# =========================
# Spring Application
# =========================
spring.application.name=${SERVICE_NAME:auth-service}

# =========================
# Database Configuration
# =========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusworks_auth}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:reddi2273}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA/Hibernate Configuration
# =========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# =========================
# JWT Configuration
# =========================
security.jwt.secret=${JWT_SECRET:mysupersecuresecretkeythatismorethan32chars}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# Eureka Client
# =========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.ip-address=${EUREKA_IP:127.0.0.1}
eureka.client.healthcheck.enabled=true

# Lease + heartbeat tuning
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.initial-instance-info-replication-interval-seconds=30
eureka.client.registry-fetch-interval-seconds=15

# =========================
# Actuator Configuration
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# Email Configuration (SMTP)
# =========================
# Gmail SMTP Configuration (you can change this to your preferred email provider)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:campusworks2273@gmail.com}
spring.mail.password=${SMTP_PASSWORD:nlbdkysxhffrjwnt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com  


# =========================
# Application Configuration
# =========================
app.name=${APP_NAME:CampusWorks}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.verification.token.expiry=${VERIFICATION_TOKEN_EXPIRY:24}

# =========================
# College Email Validation
# =========================
app.email.college.domain=rguktn.ac.in
app.email.college.pattern=^n\\d{6}@rguktn\\.ac\\.in$

# =========================
# Logging Configuration
# =========================
logging.level.com.campusworks=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.mail=DEBUG
