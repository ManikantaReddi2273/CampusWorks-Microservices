# Server Configuration (Render sets PORT)
server.port=${PORT:9001}
server.forward-headers-strategy=framework
spring.application.name=task-service

# Database Configuration (PostgreSQL / Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusworks_tasks}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:reddi2273}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari — Neon-safe
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${EUREKA_INSTANCE_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_INSTANCE_SECURE_PORT:443}

# Optional direct Feign URLs (Render free tier)
services.bidding-service.url=${BIDDING_SERVICE_URL:}
services.profile-service.url=${PROFILE_SERVICE_URL:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.diskspace.enabled=false
eureka.client.healthcheck.enabled=false

# Logging
logging.level.com.campusworks.task=INFO
logging.level.org.hibernate.SQL=WARN

# Task Service Specific
task.bidding-period-hours=5
task.max-description-length=1000
task.max-title-length=100
task.min-budget=50.0
task.max-budget=10000.0

# Feign
feign.client.config.default.connectTimeout=15000
feign.client.config.default.readTimeout=60000
feign.circuitbreaker.enabled=true
spring.cloud.loadbalancer.ribbon.enabled=false

# SMTP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:campusworks2273@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
