# Server Configuration (Render sets PORT)
server.port=${PORT:9003}
server.forward-headers-strategy=framework
spring.application.name=profile-service

# Database Configuration (PostgreSQL / Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusworks_profile}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:reddi2273}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${EUREKA_INSTANCE_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_INSTANCE_SECURE_PORT:443}

# Optional direct Feign URL
services.task-service.url=${TASK_SERVICE_URL:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.campusworks.profile=INFO
logging.level.org.hibernate.SQL=WARN

# Profile Service Specific
profile.max-bio-length=1000
profile.max-skills-count=20
profile.max-experience-years=50
profile.rating-scale=1-5

# Feign
feign.client.config.default.connectTimeout=15000
feign.client.config.default.readTimeout=60000
feign.circuitbreaker.enabled=true
spring.cloud.loadbalancer.ribbon.enabled=false
