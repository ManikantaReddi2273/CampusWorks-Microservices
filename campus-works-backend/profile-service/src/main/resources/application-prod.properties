# Profile Service Configuration - Production
# Port: 9003

# Server Configuration
server.port=9003
spring.application.name=profile-service

# Database Configuration
spring.datasource.url=${PROFILE_DB_URL:jdbc:mysql://localhost:3306/campusworks_profile?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:reddi2273}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.instance.hostname=${EUREKA_HOSTNAME:profile-service}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Logging Configuration
logging.level.com.campusworks.profile=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Profile Service Specific Configuration
profile.max-bio-length=1000
profile.max-skills-count=20
profile.max-experience-years=50
profile.rating-scale=1-5

# Feign Client Configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
feign.client.config.default.loggerLevel=basic

# Circuit Breaker Configuration
feign.circuitbreaker.enabled=true
feign.circuitbreaker.group.enabled=true

# Load Balancer Configuration
spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.loadbalancer.cache.enabled=true
